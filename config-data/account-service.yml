server:
  port: 8082 # Puerto para Cuentas

spring:
  application:
    name: account-service
  data:
    mongodb:
      # Database per service: Cuentas tiene su propia BD
      uri: mongodb://localhost:27017/bank_accounts
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

  main:
    web-application-type: reactive

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Configuración de Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

# Documentación OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.banco.account: DEBUG