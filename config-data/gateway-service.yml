server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Permite encontrar servicios automáticamente
          lower-case-service-id: true
      
      # [cite_start]Aquí definimos las rutas manuales [cite: 1895]
      routes:
        # Ruta para Clientes
        - id: customer-service
          uri: lb://CUSTOMER-SERVICE # lb = Load Balancer (busca en Eureka)
          predicates:
            - Path=/api/customers/**
            
        # Ruta para Cuentas
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/accounts/**

  # Fíjate que 'security' ahora está alineado dentro del mismo bloque 'spring' de arriba
  security:
    oauth2:
      resourceserver:
        jwt:
          # Esto se configurará cuando hagamos la clase de seguridad
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json